<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2520" />
      <stop offset="50%" stop-color="#1f1b17" />
      <stop offset="100%" stop-color="#14110f" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f48c06" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#ede3d2" stroke-width="8" stroke-opacity="0.15" />

  <!-- Silicon Circuit Traces -->
  <path d="M 80 160 L 160 160 L 200 200" fill="none" stroke="#f48c06" stroke-width="4" stroke-opacity="0.25" stroke-linecap="round" />
  <circle cx="80" cy="160" r="6" fill="#f48c06" fill-opacity="0.4" />
  
  <path d="M 432 160 L 352 160 L 312 200" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-opacity="0.25" stroke-linecap="round" />
  <circle cx="432" cy="160" r="6" fill="#2a9d8f" fill-opacity="0.4" />

  <path d="M 80 352 L 160 352 L 200 312" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-opacity="0.25" stroke-linecap="round" />
  <circle cx="80" cy="352" r="6" fill="#2a9d8f" fill-opacity="0.4" />

  <path d="M 432 352 L 352 352 L 312 312" fill="none" stroke="#f48c06" stroke-width="4" stroke-opacity="0.25" stroke-linecap="round" />
  <circle cx="432" cy="352" r="6" fill="#f48c06" fill-opacity="0.4" />

  <!-- Central C Icon Emblem -->
  <!-- Outer C Arc -->
  <path d="M 340 160 
           A 130 130 0 1 0 340 352 
           L 300 312 
           A 80 80 0 1 1 300 200 
           Z" 
        fill="url(#amberGrad)" 
        filter="url(#glow)" />

  <!-- Inner Silicon Core Binary Dots -->
  <circle cx="210" cy="256" r="14" fill="#2dd4bf" />
  <circle cx="256" cy="256" r="8" fill="#fffdf9" />

  <!-- Monkey Mascot Ear Accents -->
  <circle cx="130" cy="130" r="28" fill="#f48c06" fill-opacity="0.8" />
  <circle cx="130" cy="130" r="16" fill="#fdf5ea" />

  <!-- Code Bracket Highlights -->
  <text x="370" y="240" font-family="monospace" font-size="44" font-weight="900" fill="#2dd4bf" opacity="0.85">&lt;</text>
  <text x="370" y="295" font-family="monospace" font-size="44" font-weight="900" fill="#f48c06" opacity="0.85">&gt;</text>
</svg>
